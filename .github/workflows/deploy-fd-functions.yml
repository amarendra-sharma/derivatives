# Deploys the Financial Derivatives edge functions (fd-*) to the MacroNation Tournament
# Supabase project. Runs when anything under supabase/functions changes on main, or by hand
# from the Actions tab ("Run workflow"). Needs one repository secret: SUPABASE_ACCESS_TOKEN.
name: Deploy fd edge functions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-fd-functions.yml']
concurrency: deploy-fd-functions
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rtaiivegcqqmdchpguzn
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          for f in fd-grade fd-grade-quiz fd-grade-attempt fd-ai-grade fd-enroll-student fd-admin-roster fd-notify-prof-request fd-ai-instructor fd-ai-autopilot; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --yes
            echo "::endgroup::"
          done
